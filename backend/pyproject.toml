[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marionette-backend"
version = "0.1.0"
description = "提线 (Marionette) —— AI 角色扮演平台后端"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# 版本锚定见 docs/spec/SPEC.md §4.1 —— 不得替换
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.48,<0.49",
    "pydantic==2.13.4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.18,<1.19",
    "asyncpg>=0.30,<0.31",
    "pgvector>=0.3,<0.4",
    "httpx>=0.27,<0.29",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.9",
    # PNG/WEBP 角色卡读写 tEXt chunk（SillyTavern V2/V3 兼容，schemas.md §3.4）
    "pillow>=10.4,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
