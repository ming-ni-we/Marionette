[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: keep this file ASCII-only. Alembic reads it with encoding="locale",
# which fails on non-UTF-8 locales (e.g. Windows GBK) if comments contain CJK.
# The database URL is injected in alembic/env.py from env var DATABASE_URL.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
